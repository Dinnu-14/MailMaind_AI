# Render Blueprint: backend web service + optional persistent Postgres.
services:
  - type: web
    name: ai-smart-email-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false            # paste in the Render dashboard; optional (demo mode without it)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATABASE_URL      # remove this block to use ephemeral SQLite instead
        fromDatabase:
          name: smart-email-db
          property: connectionString

databases:
  - name: smart-email-db
    plan: free
